# The UFS driver is a fork of the catalog's ShengUfs component, not that component
# itself. ShengUfs hardcodes the name of the GPT partition that carries the root
# image ("userdata"), which is right on sheng because there the root image was
# flashed over the whole userdata partition, and wrong here because this board keeps
# Android's userdata intact and keeps its root image in a separate partition.
#
# The fork makes that name a boot argument with "userdata" as the default, so its
# behaviour is identical to upstream when the argument is absent, and adds nothing
# else. It is pinned by commit: the driver owns DMA, SMMU and the command ring, so a
# moving target there would make a failed boot impossible to attribute.
[[source]]
name = "ShengUfs"
kind = "driver"
git = "https://github.com/qusno1/ShengUfs.git"
commit = "72d022f7a4952c73b683222c0d40e86cdf8afd04"

