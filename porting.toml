schema_version = 1

[device]
name = "vermeer"
soc = "SM8550"
os_profile = "ipados-27.0.1-24A446"
summary = "Redmi K70 (SM8550, 16 GiB, UFS 4.0). iOS 27.0.1 arm64e bring-up."

[[area]]
id = "configuration"
status = "in_progress"
components = ["ArmDTPlatform", "ArmCpu", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "configs/**", ".gitmodules", ".github/**", ".gitignore"]
inputs = [
  "Stock ABL device tree pulled from the device: /sys/firmware/fdt via adb pull (fdt2.img, 808716 bytes, DTB v17).",
  "SoC: SM8550 (qcom,msm-id 0x207), model 'Qualcomm Technologies, Inc. 8550 vermeer'.",
  "CPU topology: 8 cores, cpu0-2 Cortex-A510 (E), cpu3-4 A715, cpu5-6 A710, cpu7 X3 (P); PSCI smc.",
  "GIC v3 at 0x17100000, redistributor stride 0x40000; PDC qcom,kalama-pdc at 0xb220000.",
  "Architectural timer 19.2 MHz (clock-frequency 0x124f800), always-on.",
  "DRAM: ddr_size 0x10 (16 GiB), usable range starts 0x80000000 with ABL carveouts.",
  "Splash region 0xb8000000 size 0x2b00000 (cont_splash_region), same as the SM8550 reference board.",
  "UFS controller ufshc@1d84000 (standard SM8550); userdata partition: first_lba 2570304, last_lba 115936099, 4096-byte LBAs (432 GiB).",
  "Panel: 1440x3200 OLED, 60/90/120 Hz (dumpsys display), HDR; touch IC pending identification.",
  "Identity for iOS 27.0.1 24A446 (iPhone17,1 BuildManifest): device_class d93ap, chip_id 0x8140, board_id 0x0C.",
  "FEAT_PAuth required by the arm64e profile: SM8550 implements Armv9 PAC; EL1 key-register checks pending on device.",
]
configuration = [
  "board.toml: soc sm8550 pinned at UniXNU-sm8550-common a9f45dc60c035084b95463781538380f4c3606c9 (the revision UniXNU-sheng reviews).",
  "os_profile ipados-27.0.1-24A446 (arm64e, XNU 12377.121.6); [ipsw] overridden to the iPhone17,1 restore image.",
  "dts/vermeer.dts: includes soc sm8550.dtsi; board memory, splash_region, E/P cluster assignment; ufs/ufsphy/gpu/gmu/gpu_smmu enabled.",
  "configs/vermeer_defconfig: arch arm64e fragment plus soc sm8550 fragment and os ipados fragment; storage/GPU archives deferred to their stages.",
]
procedure = [
  "Collected hardware inputs with adb (rooted device): fdt, partition geometry, memory map, display modes.",
  "Created the device repository from the examples/device template (format 2).",
]
findings = [
  "The splash_region geometry measured on vermeer matches the SM8550 reference board value.",
  "The stock tree exposes generic 'qcom,kryo' CPU compatibles; the cluster split comes from the soc dtsi core types.",
]
completion = ["All source pins resolve; every selected component has a record; status shows the intended overrides and patch order."]
limits = ["Panel and touch identities pending; UFS link speed pending; PAC checks pending on device."]
next_action = ["Run defconfig/fetch/status/tree, then start the firmware bring-up stage."]
evidence = ["notes/fdt2.img (stock ABL device tree, extracted 2026-11-09)"]

