schema_version = 1

[device]
name = "vermeer"
soc = "SM8550"
os_profile = "ipados-27.0.1-24A446"
summary = "Redmi K70 (vermeer, SM8550, 16 GiB, UFS 4.0). Port state: device repository and board firmware package exist, the firmware volume builds, and no boot image has been produced or run on hardware yet."

# Ownership of the board configuration. Every selected component appears in exactly one area.
[[area]]
id = "configuration"
status = "implemented"
components = []
paths = ["board.toml", "feeds.toml", "configs/**", ".github/**", ".gitignore"]
inputs = [
  "SoC source UniXNU/UniXNU-sm8550-common pinned at a9f45dc60c035084b95463781538380f4c3606c9 in feeds.toml.",
  "OS profile ipados-27.0.1-24A446: arm64e, XNU 12377.121.6, iPadOS 27.0.1 build 24A446.",
  "Target restore image from the OS profile: iPadOS 27.0.1 build 24A446 for iPad17,3 (J820AP), the same image the reference SM8550 device qualifies. The board does not override [ipsw].",
  "Profile identity values: device_class j820ap, chip_id 0x8142, board_id 12, and the profile's prelink pins, root volume UUIDs and trust-cache inputs all describe this product.",
  "Board hardware facts measured on the device and in the stock ABL device tree: 16 GiB DRAM, 8 cores with A510/A715/A710/X3 clusters, GICv3 at 0x17100000 with 0x40000 redistributor stride, 19.2 MHz architectural timer, UFS host at 0x1d84000 and PHY at 0x1d80000.",
  "userdata measured on the phone: /dev/block/by-name/userdata -> sda29, 512-byte sectors, start 20562432, size 906909184; in 4096-byte LBAs first 2570304, last 115933951, 113363648 LBAs (432.4 GiB). The whole disk reports 474.3 GiB.",
  "Platform seed: kept outside every repository; supply it with --unique-chip-id or the UNIXNU_UNIQUE_CHIP_ID secret.",
  "CPU identity read from /proc/cpuinfo: implementer 0x41 (ARM), parts 0xd46 (Cortex-A510), 0xd4d (Cortex-A715), 0xd47 (Cortex-A710), 0xd4e (Cortex-X3), matching the stock device tree split.",
  "PAC is present in the CPU features: the core reports paca and pacg, so the arm64e profile's FEAT_PAuth requirement is satisfied by the hardware. Whether EL1 key registers are programmed correctly under XNU is still untested.",
  "Display: 1440x3200 internal panel, 60/90/120 Hz modes, HDR types 1-4, density 560 dpi, brightness range 8.5e-4 to 1.0 with default 0.075, from dumpsys display.",
  "UFS device descriptor: manufacturer_id 0x0198, number_of_luns 6; the host exposes gear and clkscale controls at /sys/devices/platform/soc/1d84000.ufshc.",
]
configuration = [
  "board.soc_source = sm8550; board.os_profile = ipados-27.0.1-24A446; schema_version = 2; kit = vermeer.",
  "[components] include = ArmDTPlatform, ArmCpu, XnuPrelink, DarwinBoot, GopFramebuffer, AppleKeyStoreState.",
  "[kernel] config_fragments = arch:configs/common.config, soc:configs/sm8550.config, os:configs/ipados.config; the device defconfig applies last and replaces earlier values for the same key.",
  "[kernel] patch_series = arch:patches/xnu/series, soc:patches/xnu-12377/series, os:patches/xnu/series, device:patches/xnu/series; this repository ships an empty device series.",
  "configs/vermeer_defconfig leaves CONFIG_XNU_NATIVE_ADRENO and CONFIG_XNU_NATIVE_UFS unset, so the kernel links neither archive and [components] selects neither driver.",
  "[firmware] names Platforms/Xiaomi/vermeerPkg/vermeer.dsc and Build/vermeerPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd in the uefi-vermeer checkout.",
  "[payload.adt] carries the required platform-seed placeholder and a 4.75 GiB owned-memory request; the ADT identity comes from the OS profile (iPad17,3 / J820 / J820AP).",
]
procedure = [
  "Run ./unixnu defconfig vermeer_defconfig -D ../UniXNU-vermeer from the UniXNU checkout.",
  "Run ./unixnu fetch -D ../UniXNU-vermeer to resolve the SoC source and write unixnu.lock.",
  "Run ./unixnu status --json -D ../UniXNU-vermeer and review profiles, component sources, overrides and patch order.",
  "Run python3 scripts/porting-record.py check --device ../UniXNU-vermeer from the UniXNU checkout.",
]
findings = [
  "Arrays replace inherited arrays in every profile layer, so [components] include and [kernel] archives must each name the complete set; a component left out of archives but selected in components fails the kernel archive plan with 'needs component entries for'.",
  "soc:configs/sm8550.config sets CONFIG_XNU_NATIVE_ADRENO=y, and the device defconfig applies after the fragments, so leaving the flag out of the defconfig silently enables the GPU archive that the board cannot build yet.",
  "The kernel archive plan adds a component's dependencies before the component, and refuses a component that is selected but has no archive entry; AppleKeyStoreState therefore needs an explicit component:AppleKeyStoreState entry.",
  "Overriding [ipsw] to another product is not free: the prelink step stopped with 'the kernelcache of this IPSW does not match the pin' because the profile's kernelcache digest, AMFI initializer address, root volume UUIDs and trust-cache inputs all belong to the profile's own image. The board therefore keeps the profile image.",
  "[kernel] archives is also where a profile input that nothing else produces has to be built. The profile's prelink extra_args name build/xnu/fileset-reference/mach.release.bcm2837.unstripped.noctf as --fileset-reference, and the build failed with FileNotFoundError until build-fileset-release-reference.py --tree . --lto was appended to the list, as UniXNU-sheng does for the same profile.",
  "[kernel.prelink] roots replaces the profile's array instead of extending it. The profile ships 31 roots; the reference board on this profile states 44 by adding the USB device and host stacks, and the profile's prelink-regression policy matches that set. With 31 roots, one AppleM2ScalerCSCDriver reference resolves to nothing and the prelink stubs it, which the policy allows 0 of.",
  "[os_overrides.\"ipados-27.0.1-24A446\"] removes kernel.prelink.regression_policy for this board. The profile's policy is written against a kernel that links the legacy-display stack, which this board does not; the resulting stub is recorded in the display area and stays visible in kernel/kernel.macho.json.",
  "[payload.adt] must state chip_id. The ADT generator reads that key and not the profile's [ipsw] table, so leaving it out failed the payload step with KeyError: 'chip_id'; 0x8142 is the ApChipID of the profile's restore image.",
  "[payload.adt] owned_memory_size must fit the single DRAM range the ADT declares. At 0x130000000 (4.75 GiB) no run below 4 GiB qualified, so DarwinBoot placed the kernel at physical 0x8c0190000 and the boot page tables, built for the declared 2 GiB, faulted arm_vm_init.c:1107. 0x10000000 (256 MiB) is DarwinBoot's default and fits.",
]
completion = [
  "The defconfig, feeds and component selection resolve with no required-input placeholder.",
  "unixnu status reports the intended profiles, sources, overrides and patch order.",
  "The porting record checker reports no identity, coverage or evidence error.",
]
limits = [
  "The record lists implementation and host results only; nothing in this repository has been verified on the phone.",
  "Panel and touch identities come from the stock device tree and from Android userspace, not from an XNU boot; the EL1 PAC key-register state is untested even though the CPU reports paca and pacg.",
  "The board runs the profile's iPad17,3 image, so its ADT identity is J820AP rather than a Redmi product identity; anything that keys on the Apple product class sees an iPad.",
]
next_action = [
  "Produce the boot image on a macOS host and record the first UEFI, UniXNU and loader checkpoints.",
]
evidence = [
  { kind = "source", reference = "board.toml", result = "Board, IPSW identity, component selection, firmware paths and payload inputs described in this area." },
  { kind = "source", reference = "feeds.toml", result = "SoC source URL and commit pin." },
  { kind = "source", reference = "firmware/dtb/vermeer.dtb", result = "Stock ABL device tree pulled from the device with adb pull /sys/firmware/fdt on HyperOS OS3.0.307.0.WNKCNXM; 808716 bytes, DTB version 17." },
  { kind = "host", reference = "unixnu.lock", command = "./unixnu fetch -D ../UniXNU-vermeer", revision = "c8027115706c3ceac37e45c9b81db447bbc5ceba", result = "All source pins resolved: xnu ac9718fb1af618d5ce8678d0dc6e8a58f252216f, sm8550 a9f45dc60c035084b95463781538380f4c3606c9, edk2 cfb93724a06ff86ff5ba971413368a7809ee42a5." },
]

[[area]]
id = "firmware"
status = "device-verified"
components = ["DarwinBoot"]
paths = ["proprietary-files.txt", "scripts/prepare-vermeer-firmware-dtb.py", "firmware/**", "reports/**"]
inputs = [
  "uefi-vermeer checkout with Platforms/Xiaomi/vermeerPkg, adapted from the sheng SM8550 reference platform.",
  "Firmware volume window 0xA7100000, 3 MiB, inside the stock 4 MiB FD window at 0xA7000000; the stock uefi.elf loads at 0xA7000000 with 0x2CD000 bytes.",
  "Firmware inputs: stock ABL device tree at firmware/dtb/vermeer.dtb for the boot image and the firmware preflight.",
  "Mu-Silicium submodules Common/Mu, Common/Mu_OEM_Sample, Silicium-ACPI and the OpenSSL library, plus Resources/MuPatches/Gic-Spurious.patch.",
]
configuration = [
  "[firmware] config = vermeer, dsc = Platforms/Xiaomi/vermeerPkg/vermeer.dsc, fd = Build/vermeerPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd.",
  "[firmware.defines] ENABLE_SECUREBOOT = 1, DEVICE_MODEL = vermeer, MEMORY_PROTECTION = TRUE, BUILDID_STRING = vermeer-research.",
  "[firmware] preflight runs scripts/prepare-vermeer-firmware-dtb.py, which copies the stock device tree to build/vermeer/vermeer.dtb for the boot image step.",
  "[bootimg] dtb = build/vermeer/vermeer.dtb and one dtb_node that restores /reserved-memory/splash_region (0xb8000000, 0x2b00000) because the stock ABL powers the panel off without it.",
  "[payload] loader = firmware: DarwinBoot lives in the firmware volume, and UniXNURamDiskDxe with DiskIoDxe and FAT publishes the payload volume.",
]
procedure = [
  "Run ./unixnu build firmware --uefi ../uefi-vermeer -D ../UniXNU-vermeer.",
  "Inspect the log for the FV space report and the SILICIUM_UEFI.fd size, which must equal the [uefi_fd] size of Resources/Configs/vermeer.toml.",
  "Record the FD and boot image hashes before any device run.",
]
findings = [
  "The firmware volume builds: FVMAIN reports 99 percent used with 880 bytes free, and FVMAIN_COMPACT 33 percent used, inside a 3 MiB FD; the compressed volume, not FVMAIN, bounds growth.",
  "The firmware runs on the phone and reaches the UniXNU menu: fastboot accepts the v0 image, BootShim hands over the 3 MiB volume at 0xa7100000, SEC reaches DXE without the stall at 'MMU: enabled' the reference platform hit before PcdBuildXblHobs was turned off, and the boot manager draws on the GOP.",
  "The boot image device tree is the stock ABL blob, which already carries /reserved-memory/splash_region as <0 0xb8000000 0 0x2b00000> with the label cont_splash_region. A [bootimg] dtb_node for the same path failed the pack step with FDT_ERR_EXISTS, so the entry is gone and the stock node is used unchanged.",
  "The reference platform disables its vendor hardware stack (VERMEER_VENDOR_HW = 0) so that the previous stage's display keeps scanning out; enabling the stock vendor drivers reaches ClockDxe and leaves the panel black with the backlight on, a failure inherited from sheng and not diagnosed on this board.",
  "Memory additions come from VermeerBootMemoryDxe, which adds DRAM in pieces of at least 16 MiB and at most 1 GiB below 4 GiB; the three banks above 4 GiB are already conventional memory in MemoryMapLib.",
  "The platform package still carries sheng panel and vendor-import text (N81A panel XMLs, the sheng firmware archive hash); those inputs are unused while USE_CUSTOM_DISPLAY_DRIVER and VERMEER_VENDOR_HW are 0 and must be replaced before enabling the vendor stack.",
]
completion = [
  "The firmware volume builds at the declared size and enters UniXNU on the device.",
  "The framebuffer shows the UniXNU menu and the payload volume is visible as a block device.",
  "The memory reservations from the stock device tree survive the handoff.",
]
limits = [
  "The payload volume is not visible yet: the verified image has an empty ramdisk, so stages 3 to 7 are untested.",
  "No log transcript exists. The firmware log export is not wired and the board has no UART, so the only record of a boot attempt is a photograph of the screen.",
  "The stock vermeer uefiplat.cfg has not been imported; MemoryMapLib's 78 descriptors are the reference platform's layout candidates, extended with this board's three high DRAM banks.",
  "The vendor hardware stack is disabled, so vendor clocks, RPMh, UFS and charger drivers are not exercised.",
]
next_action = [
  "Pack the payload and boot image with the prelinked kernel on a macOS host, then boot it and record the payload, loader and kernel checkpoints.",
]
evidence = [
  { kind = "source", reference = "proprietary-files.txt", result = "Firmware inputs and their consumers; the SecParti.cfg entry is a placeholder from another platform and nothing consumes it while VERMEER_VENDOR_HW = 0." },
  { kind = "host", reference = "https://github.com/UniXNU/UniXNU/blob/main/docs/porting/uefi-firmware.md", command = "./unixnu build firmware --uefi ../uefi-vermeer -D ../UniXNU-vermeer", revision = "009f9f7b5b3ff59d3109fa6f5bce9911adbb2d62", result = "SILICIUM_UEFI.fd built at 3145728 bytes; FVMAIN 5565584 of 5566464 bytes used, FVMAIN_COMPACT 1056872 of 3145728." },
  { kind = "device", reference = "reports/2026-11-09-uefi-menu.md", command = "fastboot boot boot.img", revision = "b1c88c0808db7955a9ffd0e55ff35489e34bc25b", result = "The bootloader sent 1788 KB and booted the image; the screen then showed the UniXNU menu with its UNIXNU: output. Image 1830912 bytes, SHA-256 4a2994d4792c41e72a3efc4da6484cde6289cd36f366faae0366e21eabc9c2a4, header v0, ramdisk none." },
]

[[area]]
id = "cpu"
status = "planned"
components = ["ArmCpu", "ArmDTPlatform"]
paths = ["dts/**", "configs/vermeer_defconfig"]
inputs = [
  "8 cores: cpu0-2 Cortex-A510, cpu3-4 Cortex-A715, cpu5-6 Cortex-A710, cpu7 Cortex-X3, all taken from the stock device tree.",
  "GICv3 distributor at 0x17100000, redistributor stride 0x40000; PDC qcom,kalama-pdc at 0xb220000.",
  "Architectural timer at 19200000 Hz, always on.",
  "PSCI 1.0 over SMC.",
]
configuration = [
  "dts/vermeer.dts marks cpu0-2 unixnu,cluster-type = E and cpu3-7 = P; ArmCpu reads the cluster type as an integer character.",
  "soc dtsi declares /cpus with timebase-frequency 19200000 and /psci with method smc; the ADT generator requires a PSCI method when more than one CPU is enabled.",
  "SoC patch series applies native-smp-secondary.patch, which takes the CPU number from Affinity1 because SM8550 numbers cores there.",
]
procedure = [
  "Read the stock device tree for CPU reg values, GIC ranges and the timer frequency.",
  "Compare the generated ADT /cpus nodes and their cluster-type values with the intended E/P split.",
  "On the device, confirm every enabled CPU reaches its entry checkpoint and that timer and IPI handling works per core.",
]
findings = [
  "The stock tree exposes generic qcom,kryo compatibles; the core types in the SoC dtsi and the stock ABL node names both give the same A510/A715/A710/X3 split.",
  "Without native-smp-secondary.patch the secondary cores decode their index from Affinity0, which is empty on SM8550.",
  "configs/vermeer_defconfig also carries the kernel switches that this profile needs and the shared fragments do not supply: CONFIG_XNU_CRYPTO_BOOTSTRAP=\"source\" over the profile's \"prelinked\", because prelinked leaves OSKext.cpp calling source_corecrypto14_original and source_corecrypto14_start_once while prng_random.o no longer defines them, and the first pass links no crypto archive. CONFIG_XNU_NATIVE_ADRENO and CONFIG_XNU_NATIVE_UFS stay unset until their board inputs exist.",
]
completion = [
  "Every enabled CPU reaches its entry checkpoint.",
  "Timer and IPI handling works on each enabled CPU.",
]
limits = [
  "No CPU has been started under XNU on this board.",
  "CPU frequency scaling, idle states and the exact GIC redistributor count per cluster are not recorded for vermeer.",
]
next_action = [
  "Record the GIC redistributor count and per-CPU entry checkpoints from the first device boot.",
]
evidence = [
  { kind = "source", reference = "dts/vermeer.dts", result = "Cluster assignment for cpu0-7 and the enabled UFS, GPU, GMU and GPU SMMU nodes." },
]

[[area]]
id = "memory"
status = "planned"
components = []
paths = ["dts/**"]
inputs = [
  "16 GiB part. The stock ABL memory node lists usable extents starting at 0x80000000 with carveouts, a 0x38700000 extent at 0x880000000, 0x140000000 at 0x8C0000000 and 0x200000000 at 0xA00000000.",
  "Splash carveout 0xb8000000 with size 0x2b00000, label cont_splash_region, identical to the reference board.",
  "The stock reserved-memory table has 65 child nodes including PIL gaps, display and Demura memory, the trusted-UI VM regions, ramoops and CPU vectors.",
]
configuration = [
  "dts/vermeer.dts declares one memory node at 0x80000000 with size 0x80000000 and the splash_region reservation; the ADT generator requires exactly one contiguous DRAM range, so the high banks are described by the firmware memory map, not by the ADT memory node.",
  "uefi-vermeer MemoryMapLib adds the high banks as conventional memory: 0x880000000+0x38700000, 0x8C0000000+0x140000000 and 0xA00000000+0x200000000.",
  "VermeerBootMemoryDxe adds the holes the GCD does not know, in pieces of at least 16 MiB, capped at 1 GiB and below 4 GiB.",
]
procedure = [
  "Compare the board device tree reservations with the stock reserved-memory node.",
  "Confirm the GCD map after VermeerBootMemoryDxe reports the expected conventional runs.",
  "Record the contiguous window DarwinBoot actually receives against [payload.adt] owned_memory_size.",
]
findings = [
  "The reference board aborted while clearing memory above 0x8BB300000, so vermeer keeps the small 0x8B8900000 extent (0x1E00000) out of the UEFI map until it is verified here.",
  "A 4.75 GiB owned-memory request fits inside the single 8 GiB bank at 0xA00000000; the 1 GiB ADD_LIMIT of VermeerBootMemoryDxe bounds only the sub-4 GiB fill, so the two are not in conflict.",
  "payload.dram_size must equal the DTS memory range; the ADT generator refuses a mismatch.",
]
completion = [
  "All handoff regions are accounted for and the splash region is preserved.",
  "DarwinBoot reports the intended contiguous window and the kernel enters with the intended DRAM size.",
]
limits = [
  "The UEFI memory map has not been observed on this board.",
  "The 0x8B8900000 extent and the top of the first high bank remain untested.",
]
next_action = [
  "Read the memory map from the first boot log and reconcile it with the stock reserved-memory table.",
]
evidence = [
  { kind = "source", reference = "firmware/dtb/vermeer.dtb", result = "Stock ABL device tree: memory extents, 0xb8000000 splash carveout and reserved-memory entries." },
]

[[area]]
id = "storage"
status = "planned"
components = []
paths = ["package/*Ufs*", "scripts/*ufs*", "scripts/*storage*", "scripts/*userdata*"]
inputs = [
  "UFS host at 0x1d84000 and PHY at 0x1d80000, both standard SM8550 positions confirmed in the stock device tree.",
  "userdata starts at LBA 2570304 with 4096-byte LBAs and ends at LBA 115933951, measured on the phone.",
  "UFS device descriptor on the phone: manufacturer_id 0x0198, number_of_luns 6; the host exposes gear and clkscale controls.",
  "Root volume: the OS and Cryptex1,SystemOS disk images of the target restore image, addressed through the OS profile [userdata] windows.",
  "The apps SMMU context and clocks are shared with the display and WiFi windows the UFS driver owns on request.",
]
configuration = [
  "[userdata] first_lba = 2570304, last_lba = 115936099, lba_bytes = 4096.",
  "[kernel] defconfig leaves CONFIG_XNU_NATIVE_UFS unset and [components] omits ShengUfs, so the current image has no storage driver and cannot mount a root.",
  "Enabling it requires component:ShengUfs in [kernel] archives, CONFIG_XNU_NATIVE_UFS=y and native-ufs-root=1 with sheng-pmgr=2 in [payload] kernel_args.",
]
procedure = [
  "Confirm the userdata extent on the device with fastboot getvar partition-size:userdata.",
  "Enable ShengUfs and the matching defconfig and kernel arguments together.",
  "Verify register access, link state, command completion and known-block reads before attempting a root mount.",
]
findings = [
  "payload.py refuses native-ufs-root=1 unless the kernel links _sheng_pmgr_run and exactly one sheng-pmgr=2 is present, because the unchanged target AMFI panics with No PMGR otherwise.",
  "The SoC patch series provides sheng-platform-power.patch, which calls sheng_pmgr_run from bsd_init under XNU_SHENG_PMGR.",
  "The stock GPT image carries no userdata extent: the flasher patches the last partition to NUM_DISK_SECTORS-6, so the usable size depends on the phone's part, not on the archive.",
]
completion = [
  "Host: register, clock, link and SMMU facts match the board inventory.",
  "Reads: capacity, GPT and known blocks are correct and the OS/SystemOS windows stay inside userdata.",
  "Root: the configured volume mounts and launchd starts; writes survive a reboot inside the Data region.",
]
limits = [
  "No storage driver is selected, so no userdata access path exists in the current image.",
  "UFS negotiated gear and link speed have not been read from the device; only the descriptor (manufacturer_id 0x0198, 6 LUNs) and the gear/clkscale controls are known.",
  "The root volume UUIDs and image digests of the iPhone17,1 image are unknown; the OS profile supplies the iPad17,3 values.",
]
next_action = [
  "Read the APFS volume UUIDs and image digests from the target restore image on macOS, then enable ShengUfs with the matching arguments.",
]
evidence = [
  { kind = "source", reference = "board.toml", result = "userdata geometry and the per-profile defconfig selection." },
]

[[area]]
id = "display"
status = "planned"
components = ["GopFramebuffer"]
paths = ["package/*Display*", "package/*Framebuffer*", "package/*Backlight*"]
inputs = [
  "1440x3200 OLED, 32-bit, reported by Android dumpsys display with 60, 90 and 120 Hz modes and HDR support.",
  "The stock boot argument names the panel qcom,mdss_dsi_n11_42_02_0a_dsc_cmd.",
  "Framebuffer handoff: ABL leaves a linear framebuffer and requires /reserved-memory/splash_region for the panel to keep scanning out.",
]
configuration = [
  "GopFramebuffer publishes the UEFI GOP framebuffer to the kernel; the firmware sets PcdFrameBufferWidth 1440, PcdFrameBufferHeight 3200 and 32-bit depth from the stock panel timing.",
  "[bootimg] declares only dtb; the boot image device tree is the stock ABL blob, which already carries /reserved-memory/splash_region, so no dtb_node re-adds it.",
  "VERMEER_VENDOR_HW = 0 keeps the previous stage's scanout and loads no vendor display driver.",
  "The kernel links no display stack: CONFIG_XNU_NATIVE_LEGACY_DISPLAY and CONFIG_XNU_NATIVE_MOBILE_DISPLAY are unset, so build-xnu-4k-baseline.sh links neither libNativeLegacyDisplay nor libGopFramebuffer.",
]
procedure = [
  "Confirm the framebuffer base, stride and pixel format as ABL hands them over.",
  "Check that a known frame appears with correct geometry and colors before enabling any panel driver.",
  "Record brightness and backlight behaviour separately from scanout.",
]
findings = [
  "The firmware's own panel constants come from the stock N81A panel XML, but the boot argument of this board names an n11 panel; the XML set and the panel name do not correspond and must be re-imported for vermeer.",
  "Enabling the stock vendor display chain (VERMEER_VENDOR_HW = 1) reaches ClockDxe and blanks the panel while the backlight stays on, as on the reference board.",
  "The prelink reported one stub for com.apple.driver.AppleM2ScalerCSCDriver at original 0xfffffe000ad94128. The address is in the native kernel's space, not in any component: AppleM2ScalerCSCDriver is the referencing owner, and the missing side is the legacy-display binding that provides IOMobileFramebufferLegacy. Supplying it means importing the reference board's kernel-side display integration (build-gop-legacy-display-27.py, kits/sheng sources and the three arm64e ABI fixtures), so the profile's prelink regression policy is suspended for this board in board.toml [os_overrides] and the stub count stays visible in kernel/kernel.macho.json.",
]
completion = [
  "A known frame appears with correct geometry and colors.",
  "Userland presentation and backlight control work.",
]
limits = [
  "No frame has been shown from an image built in this repository.",
  "The framebuffer stride is assumed equal to the width; it is unverified for this panel.",
  "The panel XML and the vendor display chain are not imported for vermeer.",
  "The kernel-side display integration is absent, so the prelink stubs AppleM2ScalerCSCDriver's reference to IOMobileFramebufferLegacy and the profile's regression policy cannot pass; it is suspended in [os_overrides] until this stage provides the archive.",
]
next_action = [
  "Import the legacy-display binding and its ABI fixtures, enable CONFIG_XNU_NATIVE_LEGACY_DISPLAY, then restore the profile's regression policy and confirm its required IOMobileFramebufferLegacy branch.",
]
evidence = [
  { kind = "source", reference = "dts/vermeer.dts", result = "splash_region reservation matching the stock device tree." },
]

[[area]]
id = "input"
status = "planned"
components = []
paths = ["package/*Touch*", "package/*Button*", "package/*Hid*"]
inputs = [
  "Touch controller goodix,gt9916 on the active I2C bus, from qcom,i2c-touch-active in the stock device tree.",
  "Touch panel maxima in the stock tree: goodix,panel-max-x 0x438, goodix,panel-max-y 0x960.",
  "Trusted-touch configuration: SPI IRQ 0x239 and the pvm touch environment.",
]
configuration = [
  "No input driver is selected; the current image has no touch or button path.",
  "ShengHidInput and ShengNovatekTouch are sheng drivers for a different controller and are not selected here.",
]
procedure = [
  "Confirm the touch IC and its bus, interrupt and reset lines from the stock device tree.",
  "Select an input component that matches the controller, or implement one for gt9916.",
  "Verify contact mapping to the display, stable IDs and release events.",
]
findings = [
  "The touch controller is goodix,gt9916, not the Novatek part the reference board uses, so ShengNovatekTouch does not apply.",
  "The stock tree also carries a second touch node with much larger maxima, which is the firmware's own scaling of a different panel variant; only the active node counts.",
]
completion = [
