  { kind = "host", reference = "unixnu.lock", command = "./unixnu status --json -D ../UniXNU-vermeer", revision = "c8027115706c3ceac37e45c9b81db447bbc5ceba", result = "Profiles, component sources and patch order resolve; the kernel archive plan reported the missing Adreno740 and AppleKeyStoreState entries before this record." },
]

