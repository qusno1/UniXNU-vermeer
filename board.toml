schema_version = 2

[board]
name = "vermeer"
soc = "SM8550"
soc_source = "sm8550"
os_profile = "ipados-27.0.1-24A446"
description = "Redmi K70"
kit = "vermeer"
example = false

[components]
# GPU support is deferred to the gpu stage: Adreno740/AdrenoMetal need the board's ZAP firmware,
# GMU votes and GPU SMMU inputs, none of which are imported yet. The defconfig keeps
# CONFIG_XNU_NATIVE_ADRENO off so the kernel does not link an archive this tree cannot build.
include = ["ArmDTPlatform", "ArmCpu", "XnuPrelink", "DarwinBoot", "GopFramebuffer", "AppleKeyStoreState"]

# The target image is the one the selected OS profile qualifies: iPadOS 27.0.1 build
# 24A446 for iPad17,3 (J820AP), the same restore image and product the reference SM8550
# device uses. The profile's prelink pins (kernelcache digest, AMFI initializer address),
# its root volume UUIDs and its trust-cache inputs all describe that product, so
# overriding the image here would invalidate every one of them: the prelink step stops
# with "the kernelcache of this IPSW does not match the pin". No [ipsw] table, so the
# profile's url, product, device_class, chip_id and fetch list apply.
#
# Consequence to keep in mind: the ADT identity comes from the profile too (iPad17,3 /
# J820 / J820AP). This board runs that image, it does not impersonate an iPhone.

[kernel]
defconfig = "vermeer_defconfig"
archives = ["build-corecrypto-14.py", "build-corecrypto-14.py --namespace", "component:ArmDTPlatform", "component:ArmCpu", "build-libpthread-kernel.py", "component:AppleKeyStoreState", "build-fileset-release-reference.py --tree . --lto"]
# Arrays replace the profile lists; keep arch, soc, os and device in order.
config_fragments = ["arch:configs/common.config", "soc:configs/sm8550.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu-12377/series", "os:patches/xnu/series", "device:patches/xnu/series"]

[userdata]
# Measured on the phone 2026-11-09: /dev/block/by-name/userdata -> sda29, 512-byte
# sectors, start 20562432, size 906909184. In 4096-byte LBAs that is first 2570304 and
# last 115933951 (113363648 LBAs, 432.4 GiB).
first_lba = 2570304
last_lba = 115933951
lba_bytes = 4096

# roots replace the profile array. The profile ships 31; the reference board for this same
# ipados-27.0.1-24A446 kernelcache extends them with the USB device and host stacks, and the
# profile's prelink-regression policy is written against that full set. With the 31 roots the
# prelink stubbed one AppleM2ScalerCSCDriver reference that the policy allows 0 of, so the
# reference list is used here too. The two leading "!" entries exclude components the native
# kernel provides itself.
[kernel.prelink]
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleAudioClockLibs",
  "com.apple.driver.AppleEffaceableStorage",
  "com.apple.driver.AppleIISController",
  "com.apple.driver.AppleM2ScalerCSCDriver",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.driver.ApplePMGR",
  "com.apple.driver.IODARTFamily",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.CoreAnalyticsFamily",
  "com.apple.iokit.IOAVFamily",
  "com.apple.iokit.IOAudio2Family",
  "com.apple.iokit.IOCECFamily",
  "com.apple.iokit.IOCryptoAcceleratorFamily",
  "com.apple.iokit.IOGPUFamily",
  "com.apple.iokit.IOHDCPFamily",
  "com.apple.iokit.IOMobileGraphicsFamily",
  "com.apple.iokit.IOReportFamily",
  "com.apple.iokit.IOSlowAdaptiveClockingFamily",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.iokit.IOSurface",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.kext.AppleMatch",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
  "com.apple.security.sandbox",
  "com.apple.iokit.IOHIDFamily",
  "com.apple.iokit.IOHIDEventDriver",
  "com.apple.iokit.IOUSBDeviceFamily",
  "com.apple.driver.AppleUSBXDCI",
  "com.apple.driver.AppleUSBDeviceMux",
  "com.apple.iokit.IOUSBHostFamily",
  "com.apple.driver.usb.AppleUSBXHCI",
  "com.apple.driver.usb.AppleUSBHub",
  "com.apple.driver.usb.AppleUSBHostCompositeDevice",
  "com.apple.driver.usb.IOUSBHostHIDDevice",
  "com.apple.iokit.IOUSBMassStorageDriver",
  "com.apple.iokit.IOSCSIArchitectureModelFamily",
  "com.apple.iokit.IOSCSIBlockCommandsDevice",
  "!com.apple.driver.AppleOnboardSerial",
  "!com.apple.driver.AppleSMC",
]

[device_tree]
source = "device:dts/vermeer.dts"
include_dirs = ["soc:dts"]

[firmware]
preflight = ["scripts/prepare-vermeer-firmware-dtb.py"]
config = "vermeer"
dsc = "Platforms/Xiaomi/vermeerPkg/vermeer.dsc"
fd = "Build/vermeerPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
patches = ["Resources/MuPatches/Gic-Spurious.patch"]
packages = ["{uefi}", "{uefi}/Platforms/Xiaomi", "{tree}/package", "{tree}/drivers/DarwinBoot", "{edk2}", "{uefi}/Common/Mu", "{uefi}/Common/Mu_OEM_Sample", "{uefi}/Silicon/Qualcomm", "{uefi}/Silicon/Silicium", "{uefi}/Silicium-ACPI", "{uefi}/Silicium-ACPI/Platforms/Xiaomi", "{uefi}/Silicium-ACPI/Silicon/Qualcomm"]

[firmware.defines]
ENABLE_SECUREBOOT = "1"
DEVICE_MODEL = "vermeer"
MEMORY_PROTECTION = "TRUE"
BUILDID_STRING = "vermeer-research"

[bootimg]
dtb = "build/vermeer/vermeer.dtb"
# No dtb_node: the boot image device tree is the stock ABL blob copied by the preflight,
# and that blob already carries /reserved-memory/splash_region as
# <0 0xb8000000 0 0x2b00000> with the label cont_splash_region. A dtb_node here made the
# pack step fail with "Error at 'splash_region': FDT_ERR_EXISTS", because the pack step
# creates the node before writing its properties.

[payload]
volume = "VERMEER"
# 192 MiB as on sheng for the same 24A446 profile. A community vermeer port reports that this
# K70 refuses a ~198 MB fastboot boot image part-way through the transfer ("Device sent unknown
# status code") and uses 64 MiB instead; that is unverified here. If the first `fastboot boot`
# fails during the transfer rather than in the firmware, lower this together with the same
# report's notes and rebuild.
size_mib = 192
loader = "firmware"
title = "UniXNU"
panic_screen = true
kernel_args = ["-v", "serial=3", "debug=0x14e"]

[payload.adt]
# Required: the ADT generator reads this key of [payload.adt], not the profile's [ipsw] table.
# 0x8142 is the ApChipID the profile's restore image reports for iPad17,3 (profile chip_id
# 33090), which is also what the reference board states for this profile.
chip_id = "8142"
# DarwinBoot reserves one contiguous conventional-memory run of this size. The 16 GiB part
# supplies it above 4 GiB: MemoryMapLib adds the three high banks as conventional memory
# (0x880000000+0x38700000, 0x8C0000000+0x140000000 and 0xA00000000+0x200000000), so a
# 4.75 GiB window fits inside one bank. VermeerBootMemoryDxe's 1 GiB ADD_LIMIT only bounds
# the DRAM it fills in below 4 GiB. Unverified on this board until a boot log records the
# allocated window.
owned_memory_size = "0x130000000"
unique_chip_id = "required"

# No [adt] identity override: the OS profile supplies model iPad17,3, target-type J820 and
# compatible J820AP, matching the restore image its prelink pins were qualified against.

# The profile's prelink-regression policy is suspended for this board.
#
# The policy was authored against a kernel that carries the display stack: its
# required_original_branches name IOMobileFramebufferLegacy's constructor and
# IOHIDDevice::handleOpen, and its stubbed table lists every gap that build left. This
# board runs with VERMEER_VENDOR_HW = 0 and no display driver, so the prelink necessarily
# stubs components that only the legacy-display archive satisfies: AppleM2ScalerCSCDriver
# ends up with one stub at original 0xfffffe000ad94128, which the policy allows 0 of.
#
# Providing that archive means importing the reference board's kernel-side display
# integration (build-gop-legacy-display-27.py plus kits/sheng/*.cpp, the three arm64e ABI
# fixtures and the NativeGOPPresenter/NativeHID components), which is the display stage's
# work and is recorded as such. Until then the gate cannot pass on this board, so the key
# is removed here instead of being loosened: the stub count stays visible in
# kernel/kernel.macho.json and in the display area of porting.toml.
[os_overrides."ipados-27.0.1-24A446"]
remove = ["kernel.prelink.regression_policy"]

[package]
unixnu = "../UniXNU"

[package.defconfig]
"ipados-27.0.1-24A446" = "vermeer_defconfig"
