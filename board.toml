schema_version = 2

[board]
name = "vermeer"
soc = "SM8550"
soc_source = "sm8550"
os_profile = "ipados-27.0.1-24A446"
description = "Redmi K70"
kit = "vermeer"

[components]
include = ["ArmDTPlatform", "ArmCpu", "XnuPrelink", "DarwinBoot", "GopFramebuffer", "AppleKeyStoreState", "Adreno740", "AdrenoMetal"]

[ipsw]
url = "https://updates.cdn-apple.com/2026FallFCS/59ffd938-75b6-41e5-af04-f4295ee8aeb3/iPhone17,1_27.0.1_24A446_Restore.ipsw"
product = "iPhone17,1"
version = "27.0.1"
build = "24A446"
device_class = "d93ap"
chip_id = 33088
board_id = 12
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache", "OS", "Cryptex1,SystemOS"]

[kernel]
defconfig = "vermeer_defconfig"
archives = ["build-corecrypto-14.py", "build-corecrypto-14.py --namespace", "component:ArmDTPlatform", "component:ArmCpu", "build-libpthread-kernel.py"]
# Arrays replace the profile lists; keep arch, soc, os and device in order.
config_fragments = ["arch:configs/common.config", "soc:configs/sm8550.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu-12377/series", "os:patches/xnu/series", "device:patches/xnu/series"]

[userdata]
first_lba = 2570304
last_lba = 115936099
lba_bytes = 4096

[device_tree]
source = "device:dts/vermeer.dts"
include_dirs = ["soc:dts"]

[firmware]
# Preflight and the vendor image land with the firmware bring-up stage.
config = "vermeer"
dsc = "Platforms/Xiaomi/vermeerPkg/vermeer.dsc"
fd = "Build/vermeerPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
patches = ["Resources/MuPatches/Gic-Spurious.patch"]
packages = ["{uefi}", "{uefi}/Platforms/Xiaomi", "{tree}/package", "{tree}/drivers/DarwinBoot", "{edk2}", "{uefi}/Common/Mu", "{uefi}/Common/Mu_OEM_Sample", "{uefi}/Silicon/Qualcomm", "{uefi}/Silicon/Silicium", "{uefi}/Silicium-ACPI", "{uefi}/Silicium-ACPI/Platforms/Xiaomi", "{uefi}/Silicium-ACPI/Silicon/Qualcomm"]

[firmware.defines]
ENABLE_SECUREBOOT = "1"
DEVICE_MODEL = "vermeer"
MEMORY_PROTECTION = "TRUE"
BUILDID_STRING = "vermeer-research"

[bootimg]
dtb = "build/vermeer/vermeer.dtb"
dtb_node = [{ "path" = "/reserved-memory/splash_region", "props" = [{ "name" = "label", "type" = "s", "value" = "cont_splash_region" }, { "name" = "reg", "type" = "x", "value" = ["0x0", "0xb8000000", "0x0", "0x2b00000"] }] }]

[payload]
volume = "VERMEER"
size_mib = 192
loader = "firmware"
title = "UniXNU"
panic_screen = true
kernel_args = ["-v", "serial=3", "debug=0x14e"]

[payload.adt]
chip_id = "8140"
owned_memory_size = "0x130000000"
unique_chip_id = "required"

[adt]

[adt.root.string]
model = "iPhone17,1"
"target-type" = "D63"
compatible = "D63AP"

[adt.product.string]
model = "D63AP"

[package]
unixnu = "../UniXNU"

[package.defconfig]
"ipados-27.0.1-24A446" = "vermeer_defconfig"
