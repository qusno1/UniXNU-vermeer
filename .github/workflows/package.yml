name: package

# The example's copy of the packaging action (docs/porting/packaging.md). Replace the
# firmware repository below with this board's; the device name appears in the artifact
# paths. The platform seed comes from the repository secret UNIXNU_UNIQUE_CHIP_ID and is
# baked into the images, so the run's artifacts belong to one device alone: download
# them, then delete the run. Run it in a fork of the device repository.

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile of the images"
        type: choice
        options: ["17", "26", "27"]
        default: "17"
      root_image:
        description: "Also rebuild the root image (skip when the flashed unixnu image is still current)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          path: UniXNU
          # Pinned so a run is reproducible: this is the UniXNU revision that produced the
          # recorded images, and it pins drivers/AppleKeyStoreState to 58e5461, which the
          # upstream repository still serves. Upstream main moved to a submodule commit
          # (6ff4f11d) whose repository does not contain it, so an unpinned checkout fails
          # with "upload-pack: not our ref" before any build starts. Bump this deliberately.
          ref: 95ad78129203442c3c14c02336303adbddf8d0a3
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: qusno1/uefi-vermeer   # this board's firmware checkout
          path: uefi-vermeer
          submodules: recursive   # the firmware volume builds from the checkout's submodules
      - name: tools
        run: |
          brew install dtc llvm lld cmake mtools blacktop/tap/ipsw
          # Fail fast, naming the tool, before forty minutes of build.
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \
                   mformat mcopy ipsw; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -f "/opt/homebrew/opt/llvm/bin/$t" ] || [ -f "/opt/homebrew/opt/lld/bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]
      - name: platform seed
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{8}$ ]]; then
            echo 'Set the repository secret UNIXNU_UNIQUE_CHIP_ID: the platform seed of the device, 8 hex digits.' >&2
            exit 1
          fi
      - name: trust modules
        working-directory: device
        run: |
          python3 ../UniXNU/unixnu fetch -D . --os "${{ inputs.os }}" > "$RUNNER_TEMP/fetch.txt" 2>&1 \
            || { tail -20 "$RUNNER_TEMP/fetch.txt"; exit 1; }
          static=$(python3 ../UniXNU/unixnu ipsw fetch --os "${{ inputs.os }}" -D . StaticTrustCache | tail -n 1)
          systemos=$(python3 ../UniXNU/unixnu ipsw fetch --os "${{ inputs.os }}" -D . "Cryptex1,SystemTrustCache" | tail -n 1)
          app=$(python3 ../UniXNU/unixnu ipsw fetch --os "${{ inputs.os }}" -D . "Cryptex1,AppTrustCache" | tail -n 1)
          printf '%s\n%s\n%s\n' "$static" "$systemos" "$app" > "$RUNNER_TEMP/trust-modules.txt"
      - name: trust bundle
        working-directory: device
        run: |
          { read static; read systemos; read app; } < "$RUNNER_TEMP/trust-modules.txt"
          python3 ../UniXNU/scripts/bundle-ipsw-trust.py "$RUNNER_TEMP/apple-trust.bundle" \
            "$static" "$systemos" "$app"
      - name: package
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          scripts/package.sh --os "${{ inputs.os }}" --uefi ../uefi-vermeer \
            --trust-cache "$RUNNER_TEMP/apple-trust.bundle"
      - name: root tables
        if: inputs.root_image
        working-directory: device
        run: python3 scripts/build-vermeer-root-tables.py --os "${{ inputs.os }}"
      - name: root image
        if: inputs.root_image
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          shopt -s nullglob
          objects=()
          for table in ../UniXNU/out/vermeer/*/*/vermeer-root/*.vroot; do
            objects+=(--object "$(basename "$table")=$table")
          done
          [ ${#objects[@]} -gt 0 ] || { echo 'no root tables found'; exit 1; }
          python3 ../UniXNU/unixnu userdata --os "${{ inputs.os }}" --uefi ../uefi-vermeer "${objects[@]}"
      - name: sparse root image
        if: inputs.root_image
        working-directory: device
        run: |
          image=$(ls ../UniXNU/out/vermeer/*/*/userdata/userdata-root.img)
          python3 scripts/make-sparse-root-image.py "$image" "${image%.img}-sparse.img"
      - name: root image artifact
        if: inputs.root_image
        uses: actions/upload-artifact@v4
        with:
          name: userdata-${{ inputs.os }}
          retention-days: 7
          if-no-files-found: error
          path: |
            UniXNU/out/vermeer/*/*/userdata/userdata-root-sparse.img
            UniXNU/out/vermeer/*/*/userdata/userdata-root.json
      - name: failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.os }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            UniXNU/out/**/logs/*.log
            UniXNU/out/**/build/sheng-source-storage/*
      - name: images
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ inputs.os }}
          retention-days: 1
          if-no-files-found: error
          path: |
            UniXNU/out/vermeer/*/*/boot/boot.img
            UniXNU/out/vermeer/*/*/payload/payload.img
            UniXNU/out/vermeer/*/*/kernel/kernel.macho
            UniXNU/out/vermeer/*/*/kernel/kernel.json
            UniXNU/out/vermeer/*/*/kernel/kernel.macho.json
            UniXNU/out/vermeer/*/*/package.manifest.json
